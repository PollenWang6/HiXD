<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西电校园助手（HiXD）法律文档</title>
<style>
  :root{ --fg:#1f2329; --sub:#5b6168; --brand:#2b5cff; --line:#e6e8eb; --bg:#f7f8fa; --card:#fff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px}
  h1{font-size:26px;margin:0 0 6px}
  .meta{color:var(--sub);font-size:13px;margin-bottom:24px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:14px 0;text-decoration:none;color:inherit;transition:.15s}
  .card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(43,92,255,.08)}
  .card h2{margin:0 0 6px;font-size:18px;color:var(--brand)}
  .card p{margin:0;color:var(--sub);font-size:14px}
  footer{margin-top:32px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>西电校园助手（HiXD）</h1>
  <div class="meta">法律文档中心　|　包名：com.HiXD.myapplication　|　版本：1.4.1</div>

  <a class="card" href="privacy.html">
    <h2>隐私政策</h2>
    <p>说明我们如何收集、使用、存储与保护您的个人信息，以及设备权限调用与第三方服务情况。</p>
  </a>

  <a class="card" href="user-agreement.html">
    <h2>用户协议</h2>
    <p>说明服务范围、账号使用规范、免责声明与知识产权等条款。</p>
  </a>

  <footer>本页面由西电校园助手（HiXD）开发团队维护。</footer>
</div>
</body>
</html>
